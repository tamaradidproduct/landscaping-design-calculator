name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plan-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plan-builder/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # --if-present: `test` arrives with vitest on feat/figma-takeoff-hardening.
      - run: npm run test --if-present
