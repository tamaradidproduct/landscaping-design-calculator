<style>
/* Layout: one-screen tablet tool — method bar on top, plan canvas fills the rest, inspector on the right (bottom sheet when narrow). */
:root {
  --bg: #e9eeeb;
  --panel: #fbfcfb;
  --ink: #1b2420;
  --muted: #5a6962;
  --line: #d3dbd6;
  --accent: #2c6b59;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe5;
  --paper: #f4f6f4;
  --lotline: #c93fae;
  --warn: #9a5b00;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-label: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121816; --panel: #1a211e; --ink: #e4ebe7; --muted: #98a7a0; --line: #2c3833;
    --accent: #72c4aa; --accent-ink: #0d1916; --accent-soft: #23362f; --paper: #202825;
    --lotline: #ea72d2; --warn: #f0b45a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121816; --panel: #1a211e; --ink: #e4ebe7; --muted: #98a7a0; --line: #2c3833;
  --accent: #72c4aa; --accent-ink: #0d1916; --accent-soft: #23362f; --paper: #202825;
  --lotline: #ea72d2; --warn: #f0b45a; color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-family: var(--font-label); font-weight: 600; font-size: 17px; letter-spacing: 0.01em; margin-right: 4px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: var(--bg); border-radius: 10px; }
button { font: inherit; color: inherit; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: default; }
.seg button { border: none; background: transparent; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.spacer { flex: 1; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; background: var(--paper); }
#plan { display: block; width: 100%; height: 100%; touch-action: none; }
.hint { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: flex-start; pointer-events: none; }
.hint span { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; max-width: 46ch; line-height: 1.4; box-shadow: 0 2px 8px rgb(0 0 0 / 0.08); }
.draftbar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: 0 4px 16px rgb(0 0 0 / 0.12); }
.draftbar .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.toast { position: absolute; right: 12px; bottom: 16px; background: var(--ink); color: var(--panel); padding: 10px 14px; border-radius: 8px; max-width: 32ch; line-height: 1.35; }
.side { overflow: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 20px; }
.side h2 { font-family: var(--font-label); font-weight: 600; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.swatches { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.swatch { display: flex; align-items: center; gap: 8px; text-align: left; padding: 6px 8px; min-width: 0; }
.swatch canvas { width: 28px; height: 28px; border-radius: 5px; flex: none; border: 1px solid var(--line); }
.swatch span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.swatch[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.card .title { font-weight: 600; }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.muted { color: var(--muted); line-height: 1.45; margin: 0; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
td.num, th.num { text-align: right; font-family: var(--font-num); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.log li { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
.log .m { font-weight: 500; }
.log .t { font-family: var(--font-num); text-align: right; }
.log .d { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.danger { color: var(--warn); }
@media (max-width: 700px) {
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .side { border-left: none; border-top: 1px solid var(--line); max-height: 32vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">Zone Drawing Lab</div>
    <div class="seg" role="group" aria-label="Drawing method" id="modes"></div>
    <div class="spacer"></div>
    <div class="tools">
      <button id="undo" type="button">Undo</button>
      <button id="redo" type="button">Redo</button>
      <button id="snap" class="toggle" type="button" aria-pressed="true">Snap</button>
      <button id="fit" type="button">Fit lot</button>
    </div>
  </header>
  <div class="main">
    <div class="stage" id="stage">
      <canvas id="plan" aria-label="Site plan drawing area"></canvas>
      <div class="hint"><span id="hint"></span></div>
      <div class="draftbar" id="draftbar" hidden>
        <button id="d-close" class="primary" type="button">Close shape</button>
        <button id="d-back" type="button">Remove last point</button>
        <button id="d-cancel" type="button">Cancel</button>
      </div>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>
    <aside class="side">
      <section>
        <h2>Material for new zones</h2>
        <div class="swatches" id="swatches"></div>
      </section>
      <section>
        <h2>Selection</h2>
        <div id="selection"></div>
      </section>
      <section>
        <h2>Method comparison</h2>
        <div id="compare"></div>
      </section>
      <section>
        <h2>Trial log</h2>
        <ul class="log" id="log"></ul>
        <p class="muted" id="log-empty">Each zone you draw is timed from your first touch until the shape closes.</p>
      </section>
      <section class="row">
        <button id="reset" type="button">Reset plan</button>
        <button id="reset-yes" type="button" class="danger" hidden>Clear all zones and the log</button>
      </section>
    </aside>
  </div>
</div>

<script>
(() => {
  // ---------- Data ----------
  const MODES = [
    { id: 'select', label: 'Select', hint: 'Tap a zone to see its area. Drag the dots to reshape it. Two fingers pan and zoom.' },
    { id: 'corners', label: 'Tap corners', hint: 'Tap each corner of the zone. Tap the first point again to close it.' },
    { id: 'freehand', label: 'Freehand', hint: 'Drag one finger around the bed. Lift to close the shape; edges are smoothed.' },
    { id: 'bend', label: 'Tap + bend', hint: 'Tap corners to close a shape, then drag the square dots on each edge to curve it.' },
    { id: 'fill', label: 'Fill region', hint: 'Drag to draw an edge line. Tap inside an area enclosed by lines, the house, or other zones to fill it.' },
  ];
  const METHOD_NAMES = Object.fromEntries(MODES.map(m => [m.id, m.label]));
  const DEFAULT_MAT = { id: 'rock', name: 'White river rock', base: '#dcd5c8' };
  const MATERIALS = [
    { id: 'sod', name: 'Sod or turf', base: '#7aa156' },
    { id: 'mulch', name: 'Mulch', base: '#6c4a33' },
    { id: 'pavers', name: 'Belgard pavers', base: '#cbc3b5' },
    { id: 'concrete', name: 'Brushed concrete', base: '#bcbfbb' },
    { id: 'granite', name: 'Granite fines', base: '#c8a67c' },
    DEFAULT_MAT,
  ];
  const MAT = Object.fromEntries(MATERIALS.map(m => [m.id, m]));

  // Lot in feet (plot-plan style trapezoid, about 58 ft wide and 116 ft deep).
  const LOT = [[0, 0], [58, 3], [54, 118], [5, 116]];
  const yOnBottom = x => 116 + (x - 5) / 49 * 2;
  const EXISTING = [
    { name: 'House', pts: [[14, 30], [46, 30], [46, 90], [14, 90]], fill: '#a6aba8' },
    { name: 'Driveway', pts: [[17, 90], [33, 90], [33, yOnBottom(33)], [17, yOnBottom(17)]], fill: '#c4c6c3' },
    { name: 'Porch', pts: [[37, 90], [46, 90], [46, 96], [37, 96]], fill: '#b6b9b6' },
  ];

  let zones = [];
  let edges = [];
  let nextId = 1;
  let mode = 'corners';
  let material = 'mulch';
  let selected = null; // zone id, 'lot', or null
  let snapOn = true;
  let draft = null;     // { pts: [[x,y]] }
  let action = null;
  let hover = null;
  let trial = null;     // { start, touches }
  const undoStack = [], redoStack = [];
  const trialLog = [];
  const view = { s: 6, tx: 0, ty: 0 };
  let viewTouched = false;

  function seed() {
    zones = [
      { id: nextId++, material: 'mulch', smooth: true, method: 'example',
        pts: [[3, 1.5], [30, 2.6], [56, 4.6], [56, 9], [48, 8], [34, 7], [20, 8.5], [6, 8]], c: [] },
      { id: nextId++, material: 'sod', smooth: true, method: 'example',
        pts: [[9, 12], [28, 10.5], [47, 12], [51, 19], [44, 25.5], [24, 26], [10, 21]], c: [] },
    ];
    zones.forEach(z => { z.c = z.pts.map(() => null); });
    edges = [];
  }
  seed();

  // ---------- Geometry ----------
  const PC = window.polygonClipping;
  const shoelace = r => { let a = 0; for (let i = 0; i < r.length; i++) { const p = r[i], q = r[(i + 1) % r.length]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; };
  const ringPerim = r => { let l = 0; for (let i = 0; i < r.length; i++) { const p = r[i], q = r[(i + 1) % r.length]; l += Math.hypot(q[0] - p[0], q[1] - p[1]); } return l; };
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const quad = (a, c, b, t) => { const u = 1 - t; return [u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]; };
  const dropClose = r => (r.length > 1 && r[0][0] === r[r.length - 1][0] && r[0][1] === r[r.length - 1][1]) ? r.slice(0, -1) : r;

  function flatten(z) {
    const p = z.pts, n = p.length, out = [];
    if (z.smooth) {
      for (let i = 0; i < n; i++) {
        const a = mid(p[(i - 1 + n) % n], p[i]), b = mid(p[i], p[(i + 1) % n]);
        for (let k = 0; k < 8; k++) out.push(quad(a, p[i], b, k / 8));
      }
    } else {
      for (let i = 0; i < n; i++) {
        const a = p[i], b = p[(i + 1) % n], c = z.c[i];
        if (c) { for (let k = 0; k < 12; k++) out.push(quad(a, c, b, k / 12)); }
        else out.push(a);
      }
    }
    return out;
  }
  function mpArea(mp) {
    let a = 0;
    for (const poly of mp) poly.forEach((r, i) => { const v = Math.abs(shoelace(dropClose(r))); a += i === 0 ? v : -v; });
    return a;
  }
  function safe(fn, fallback) { try { return fn(); } catch (e) { console.warn(e); return fallback; } }
  const existingGeoms = () => EXISTING.map(e => [e.pts]);

  function visibleZone(z) {
    const idx = zones.indexOf(z);
    const later = zones.slice(idx + 1).map(q => [flatten(q)]);
    return safe(() => {
      let g = PC.intersection([flatten(z)], [LOT]);
      g = PC.difference(g, ...existingGeoms());
      if (later.length) g = PC.difference(g, ...later);
      return g;
    }, [[flatten(z)]]);
  }
  function defaultFillGeom() {
    return safe(() => PC.difference([LOT], ...existingGeoms(), ...zones.map(z => [flatten(z)])), [[LOT]]);
  }
  function pointInRing(pt, r) {
    let inside = false;
    for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
      const xi = r[i][0], yi = r[i][1], xj = r[j][0], yj = r[j][1];
      if (((yi > pt[1]) !== (yj > pt[1])) && (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  function rdp(pts, tol) {
    if (pts.length < 3) return pts.slice();
    const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1;
    const stack = [[0, pts.length - 1]];
    while (stack.length) {
      const [s, e] = stack.pop(); const a = pts[s], b = pts[e];
      const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1e-9;
      let best = -1, bi = -1;
      for (let i = s + 1; i < e; i++) {
        const d = Math.abs(dy * pts[i][0] - dx * pts[i][1] + b[0] * a[1] - b[1] * a[0]) / len;
        if (d > best) { best = d; bi = i; }
      }
      if (best > tol) { keep[bi] = 1; stack.push([s, bi], [bi, e]); }
    }
    return pts.filter((_, i) => keep[i]);
  }
  function simplifyRing(r, tol) {
    if (r.length < 4) return r;
    // start from the point farthest from r[0] so the ring is split into two halves
    let far = 0, fd = -1;
    r.forEach((p, i) => { const d = Math.hypot(p[0] - r[0][0], p[1] - r[0][1]); if (d > fd) { fd = d; far = i; } });
    const a = rdp(r.slice(0, far + 1), tol), b = rdp(r.slice(far).concat([r[0]]), tol);
    return a.slice(0, -1).concat(b.slice(0, -1));
  }
  function bbox(r) {
    const xs = r.map(p => p[0]), ys = r.map(p => p[1]);
    return { minx: Math.min(...xs), miny: Math.min(...ys), maxx: Math.max(...xs), maxy: Math.max(...ys) };
  }

  // ---------- View ----------
  const canvas = document.getElementById('plan');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  let W = 0, H = 0, dpr = 1;
  const w2s = p => [p[0] * view.s + view.tx, p[1] * view.s + view.ty];
  const s2w = p => [(p[0] - view.tx) / view.s, (p[1] - view.ty) / view.s];
  function resize() {
    const r = stage.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1; W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    draw();
  }
  function fit() {
    const b = bbox(LOT), pad = 56;
    view.s = Math.max(0.5, Math.min((W - pad * 2) / (b.maxx - b.minx), (H - pad * 2 - 40) / (b.maxy - b.miny)));
    view.tx = (W - (b.maxx - b.minx) * view.s) / 2 - b.minx * view.s;
    view.ty = (H - (b.maxy - b.miny) * view.s) / 2 - b.miny * view.s + 20;
    draw();
  }
  new ResizeObserver(() => { resize(); if (!viewTouched) fit(); }).observe(stage);

  // ---------- Material textures ----------
  function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
  function tile(m) {
    const t = document.createElement('canvas'); t.width = t.height = 64; const g = t.getContext('2d'); const r = rng(m.id.length * 9973 + m.base.charCodeAt(1));
    g.fillStyle = m.base; g.fillRect(0, 0, 64, 64);
    const shade = (d, a) => `rgba(${d < 0 ? '0,0,0' : '255,255,255'},${a})`;
    if (m.id === 'rock' || m.id === 'granite') {
      for (let i = 0; i < (m.id === 'rock' ? 70 : 220); i++) {
        const x = r() * 64, y = r() * 64, s = m.id === 'rock' ? 2 + r() * 4 : 0.6 + r() * 1.2;
        g.fillStyle = shade(r() - 0.5, 0.12 + r() * 0.2); g.beginPath(); g.ellipse(x, y, s, s * (0.6 + r() * 0.4), r() * 3, 0, 7); g.fill();
      }
    } else if (m.id === 'sod') {
      g.lineWidth = 1;
      for (let i = 0; i < 180; i++) { const x = r() * 64, y = r() * 64; g.strokeStyle = shade(r() - 0.5, 0.18); g.beginPath(); g.moveTo(x, y); g.lineTo(x + (r() - 0.5) * 3, y - 3 - r() * 3); g.stroke(); }
    } else if (m.id === 'mulch') {
      g.lineWidth = 1.6; g.lineCap = 'round';
      for (let i = 0; i < 90; i++) { const x = r() * 64, y = r() * 64, a = r() * 6.3, l = 3 + r() * 5; g.strokeStyle = shade(r() - 0.4, 0.22); g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
    } else if (m.id === 'pavers') {
      g.strokeStyle = 'rgba(0,0,0,0.22)'; g.lineWidth = 1.2;
      for (let row = 0; row < 4; row++) for (let col = -1; col < 3; col++) { const off = row % 2 ? 16 : 0; g.strokeRect(col * 32 + off + 0.5, row * 16 + 0.5, 32, 16); }
    } else {
      for (let i = 0; i < 260; i++) { g.fillStyle = shade(r() - 0.5, 0.1); g.fillRect(r() * 64, r() * 64, 1, 1); }
      g.strokeStyle = 'rgba(0,0,0,0.05)'; for (let y = 0; y < 64; y += 3) { g.beginPath(); g.moveTo(0, y); g.lineTo(64, y + 1); g.stroke(); }
    }
    return t;
  }
  const TILES = Object.fromEntries(MATERIALS.map(m => [m.id, tile(m)]));
  const patterns = {};
  function pattern(id) {
    if (!patterns[id]) patterns[id] = ctx.createPattern(TILES[id], 'repeat');
    const p = patterns[id];
    try { p.setTransform(new DOMMatrix().scale(1 / 12)); } catch (e) { /* older browsers: screen-space texture */ }
    return p;
  }

  // ---------- Drawing ----------
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function ringPath(g, r) { g.beginPath(); r.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); }
  function fmt(n, d = 1) { return n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); }

  function draw() {
    if (!W) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = css('--paper'); ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(view.tx, view.ty); ctx.scale(view.s, view.s);
    const px = 1 / view.s;
    ringPath(ctx, LOT); ctx.fillStyle = pattern('rock'); ctx.fill();
    ctx.save(); ringPath(ctx, LOT); ctx.clip();
    for (const z of zones) {
      const f = flatten(z); ringPath(ctx, f); ctx.fillStyle = pattern(z.material); ctx.fill();
      ctx.lineWidth = 1.4 * px; ctx.strokeStyle = 'rgba(30,35,32,0.55)'; ctx.stroke();
    }
    ctx.restore();
    for (const e of EXISTING) { ringPath(ctx, e.pts); ctx.fillStyle = e.fill; ctx.fill(); ctx.lineWidth = 1.2 * px; ctx.strokeStyle = 'rgba(30,35,32,0.6)'; ctx.stroke(); }
    ctx.setLineDash([6 * px, 4 * px]); ctx.lineWidth = 2 * px; ctx.strokeStyle = 'rgba(25,30,28,0.85)';
    for (const ed of edges) { ctx.beginPath(); ed.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); }
    ctx.setLineDash([]);
    ringPath(ctx, LOT); ctx.lineWidth = 2.5 * px; ctx.strokeStyle = css('--lotline'); ctx.stroke();
    if (selected === 'lot') { ringPath(ctx, LOT); ctx.lineWidth = 4 * px; ctx.strokeStyle = css('--accent'); ctx.stroke(); }
    const sz = zones.find(z => z.id === selected);
    if (sz) { ringPath(ctx, flatten(sz)); ctx.lineWidth = 3 * px; ctx.strokeStyle = css('--accent'); ctx.stroke(); }
    if (action && action.type === 'stroke' && action.pts.length > 1) {
      ctx.beginPath(); action.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      ctx.lineWidth = 2.5 * px; ctx.strokeStyle = css('--accent'); ctx.stroke();
    }

    const rows = MODES.filter(m => m.id !== 'select').map(m => {
      const ts = trialLog.filter(t => t.method === m.id);
      const avg = ts.length ? ts.reduce((s, t) => s + t.secs, 0) / ts.length : null;
      const tch = ts.length ? ts.reduce((s, t) => s + t.touches, 0) / ts.length : null;
      return `<tr><td>${m.label}</td><td class="num">${ts.length}</td><td class="num">${avg == null ? '–' : fmt(avg) + ' s'}</td><td class="num">${tch == null ? '–' : fmt(tch)}</td></tr>`;
    }).join('');
    $('compare').innerHTML = `<table><thead><tr><th>Method</th><th class="num">Zones</th><th class="num">Avg time</th><th class="num">Touches</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  function refresh() {
    renderModes(); renderSwatches(); renderSelection(); renderLog();
    $('draftbar').hidden = !draft;
    $('d-close').disabled = !draft || draft.pts.length < 3;
    $('undo').disabled = !undoStack.length && !draft; $('redo').disabled = !redoStack.length;
    draw();
  }

  $('undo').onclick = undo; $('redo').onclick = redo; $('fit').onclick = fit;
  $('snap').onclick = () => { snapOn = !snapOn; $('snap').setAttribute('aria-pressed', String(snapOn)); };
  $('d-close').onclick = closeDraft; $('d-cancel').onclick = cancelDraft;
  $('d-back').onclick = () => { if (!draft) return; draft.pts.pop(); if (!draft.pts.length) cancelDraft(); else refresh(); };
  $('reset').onclick = () => { $('reset-yes').hidden = false; };
  $('reset-yes').onclick = () => { const before = snapshot(); zones = []; edges = []; trialLog.length = 0; selected = null; draft = null; trial = null; commit(before); $('reset-yes').hidden = true; };
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (e.key === 'Enter' && draft) closeDraft();
    if (e.key === 'Escape' && draft) cancelDraft();
    if (e.key === 'Backspace' && draft) { draft.pts.pop(); if (!draft.pts.length) cancelDraft(); else refresh(); }
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  document.fonts?.ready.then(draw);
  refresh();
})();
</script>
