<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <!-- Browser chrome colour: literal copies of --color-bg (meta tags can't read CSS tokens). -->
    <meta name="theme-color" content="#e7ebe9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f2523" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Plan Builder</title>
  </head>
  <body>
    <main class="app">
      <header class="top-bar" id="top-bar" hidden></header>
      <div class="workspace">
      <div class="canvas" id="canvas" hidden>
        <div class="stage" id="stage">
          <div class="page" id="page" hidden><canvas id="base"></canvas></div>
          <canvas class="sharp" id="sharp" hidden></canvas>
          <div class="loading" id="loading" hidden>Opening plot plan…</div>
        </div>
        <div class="canvas-controls bottom-right">
          <button type="button" class="icon" id="zoom-out" aria-label="Zoom out" title="Zoom out"><svg class="line-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" /></svg></button>
          <button type="button" class="icon" id="zoom-in" aria-label="Zoom in" title="Zoom in"><svg class="line-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10" /></svg></button>
          <button type="button" class="icon" id="fit" aria-label="Fit page" title="Fit page"><svg class="line-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" /></svg></button>
        </div>
        <button type="button" class="square-float" id="square-corners" aria-label="Square corners" title="Square corners" hidden>Square corners</button>
        <div class="dock">
          <div class="segmented" id="shape" role="group" aria-label="Draw the outline" hidden>
            <button type="button" data-shape="freehand" aria-pressed="true" title="Freehand (X switches)">Freehand</button>
            <button type="button" data-shape="rect" aria-pressed="false" title="Rectangle (X switches)">Rectangle</button>
          </div>
          <button type="button" id="snap" class="toggle" aria-pressed="true" hidden>Snap on</button>
        </div>
      </div>
      <section class="screen" id="screen-auth" hidden></section>
      <section class="screen" id="screen-plans" hidden></section>
      <aside class="sidebar" id="sidebar" hidden>
        <section class="side-section layers">
          <div class="side-head">
            <h2 class="side-title">Layers</h2>
          </div>
          <div id="layers-edit">
            <div id="tools" class="tools"></div>
            <div class="layer-group" id="section-symbols">
              <div class="group-line">
                <button type="button" class="group-head" data-group="symbols" aria-expanded="true" aria-controls="group-symbols">
                  <svg class="line-icon chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
                  <span class="group-title">Plants &amp; objects</span><span class="group-count" hidden></span>
                </button>
                <button type="button" class="icon" data-eye-group="symbols" aria-pressed="true" aria-label="Hide all plants and objects" title="Hide all plants and objects">
                  <svg class="line-icon" viewBox="0 0 16 16" aria-hidden="true"><path class="eye" d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8s-2.5 4.5-6.5 4.5S1.5 8 1.5 8z" /><circle class="eye" cx="8" cy="8" r="2" /><path class="eye-off" d="M2.5 2.5l11 11" /></svg>
                </button>
              </div>
              <div class="group-body" id="group-symbols">
                <div class="layer-list" id="symbols"></div>
              </div>
            </div>
            <div class="layer-group" id="section-lines">
              <div class="group-line">
                <button type="button" class="group-head" data-group="lines" aria-expanded="true" aria-controls="group-lines">
                  <svg class="line-icon chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
                  <span class="group-title">Edges &amp; walls</span><span class="group-count" hidden></span>
                </button>
                <button type="button" class="icon" data-eye-group="lines" aria-pressed="true" aria-label="Hide all edges and walls" title="Hide all edges and walls">
                  <svg class="line-icon" viewBox="0 0 16 16" aria-hidden="true"><path class="eye" d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8s-2.5 4.5-6.5 4.5S1.5 8 1.5 8z" /><circle class="eye" cx="8" cy="8" r="2" /><path class="eye-off" d="M2.5 2.5l11 11" /></svg>
                </button>
              </div>
              <div class="group-body" id="group-lines">
                <div class="layer-list" id="lines"></div>
              </div>
            </div>
            <div class="layer-group" id="section-surfaces">
              <div class="group-line">
                <button type="button" class="group-head" data-group="surfaces" aria-expanded="true" aria-controls="group-surfaces">
                  <svg class="line-icon chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
                  <span class="group-title">Surfaces</span><span class="group-count" hidden></span>
                </button>
                <button type="button" class="icon" data-eye-group="surfaces" aria-pressed="true" aria-label="Hide all surfaces" title="Hide all surfaces">
                  <svg class="line-icon" viewBox="0 0 16 16" aria-hidden="true"><path class="eye" d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8s-2.5 4.5-6.5 4.5S1.5 8 1.5 8z" /><circle class="eye" cx="8" cy="8" r="2" /><path class="eye-off" d="M2.5 2.5l11 11" /></svg>
                </button>
              </div>
              <div class="group-body" id="group-surfaces">
                <div class="layer-list" id="surfaces"></div>
              </div>
            </div>
            <div class="layer-group" id="section-outlines">
              <div class="group-line">
                <button type="button" class="group-head" data-group="outlines" aria-expanded="true" aria-controls="group-outlines">
                  <svg class="line-icon chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
                  <span class="group-title">Outlines</span><span class="group-count" hidden></span>
                </button>
                <button type="button" class="icon" data-eye-group="outlines" aria-pressed="true" aria-label="Hide all outlines" title="Hide all outlines">
                  <svg class="line-icon" viewBox="0 0 16 16" aria-hidden="true"><path class="eye" d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8s-2.5 4.5-6.5 4.5S1.5 8 1.5 8z" /><circle class="eye" cx="8" cy="8" r="2" /><path class="eye-off" d="M2.5 2.5l11 11" /></svg>
                </button>
              </div>
              <div class="group-body" id="group-outlines">
                <div class="layer-list" id="outlines"></div>
            <div class="plan-layer">
              <h3 class="side-subtitle">Plot plan</h3>
              <div class="layer-item">
                <button type="button" class="icon" id="plan-visible" aria-pressed="true" aria-label="Hide the plot plan" title="Hide the plot plan">
                  <svg class="line-icon" viewBox="0 0 16 16" aria-hidden="true"><path class="eye" d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8s-2.5 4.5-6.5 4.5S1.5 8 1.5 8z" /><circle class="eye" cx="8" cy="8" r="2" /><path class="eye-off" d="M2.5 2.5l11 11" /></svg>
                </button>
                <button type="button" class="layer-row" id="file-button" title="Replace the plot plan">
                  <span class="layer-name" id="name"></span>
                  <svg class="line-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5.5h10M10 3l2.5 2.5L10 8M13.5 10.5h-10M6 8l-2.5 2.5L6 13" /></svg>
                </button>
              </div>
              <div class="replace-confirm" id="replace-confirm" hidden>
                <p class="replace-text" id="replace-text"></p>
                <div class="row split">
                  <button type="button" class="primary compact" id="replace-pick">Pick file</button>
                  <button type="button" class="compact" id="replace-cancel">Cancel</button>
                </div>
              </div>
              <div class="field-row">
                <label class="text-label" for="plan-opacity">Opacity</label>
                <input type="range" id="plan-opacity" min="10" max="100" step="5" value="100" />
                <span class="text-figure" id="plan-opacity-value">100%</span>
              </div>
            </div>
              </div>
            </div>
          </div>
          <div id="layers-sheet" class="sheet" hidden></div>
        </section>
      </aside>
      <div class="sidebar-resize" id="sidebar-resize" role="separator" aria-orientation="vertical" aria-controls="sidebar" aria-label="Resize the side panel" title="Drag to resize the panel · double-tap to reset" tabindex="0"></div>
      </div>
      <div class="bubble toast" id="toast" role="status" hidden></div>
      <input type="file" id="file" accept="application/pdf,.pdf,image/jpeg,.jpg,.jpeg,image/png,.png" hidden />
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
